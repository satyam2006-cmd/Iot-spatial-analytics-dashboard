<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">MQ-135 to ESP8266 pin connections</title>
  <desc id="desc">MQ-135 analog output connects to ESP8266 A0, ground connects to ground, and module VCC connects to a suitable supply.</desc>
  <rect width="1100" height="500" rx="24" fill="#f4f7fb"/>
  <text x="550" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172b4d">MQ-135 → ESP8266 wiring</text>
  <rect x="85" y="112" width="370" height="315" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="270" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">MQ-135 module</text>
  <rect x="645" y="112" width="370" height="315" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="830" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">ESP8266 NodeMCU</text>
  <rect x="125" y="195" width="260" height="55" rx="10" fill="#e0f2fe"/>
  <rect x="125" y="275" width="260" height="55" rx="10" fill="#fef3c7"/>
  <rect x="125" y="355" width="260" height="45" rx="10" fill="#e2e8f0"/>
  <text x="155" y="231" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#075985">AO · Analog out</text>
  <text x="155" y="311" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#92400e">VCC · Power</text>
  <text x="155" y="386" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">GND · Ground</text>
  <rect x="715" y="195" width="230" height="55" rx="10" fill="#dcfce7"/>
  <rect x="715" y="275" width="230" height="55" rx="10" fill="#fef3c7"/>
  <rect x="715" y="355" width="230" height="45" rx="10" fill="#e2e8f0"/>
  <text x="830" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#166534">A0 · Analog input</text>
  <text x="830" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#92400e">Suitable supply*</text>
  <text x="830" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">GND</text>
  <path d="M385 222 H715" fill="none" stroke="#0284c7" stroke-width="7"/>
  <path d="M385 302 H715" fill="none" stroke="#d97706" stroke-width="7"/>
  <path d="M385 377 H715" fill="none" stroke="#64748b" stroke-width="7"/>
  <text x="550" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">*Use a supply and analog voltage within your specific module and board limits.</text>
</svg>
